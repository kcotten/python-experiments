[project]
name = "problems"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "isort>=8.0.1",
    "matplotlib>=3.10.8",
    "mlx-lm>=0.31.3",
    "pandas>=3.0.2",
    "pandas-stubs>=3.0.0.260204",
    "pyright>=1.1.408",
    "requests>=2.34.2",
]

[dependency-groups]
dev = ["ipykernel>=7.2.0"]

[tool.ruff]
line-length = 80
indent-width = 4
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "C901", "W", "F", "I"]
ignore = []
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false
docstring-code-line-length = "dynamic"

[tool.ruff.isort]
known-first-party = ["app"]

[tool.ruff.lint.pydocstyle]
convention = "pep257" # Accepts: "google", "numpy", or "pep257".
